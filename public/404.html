<!doctype html>
<!-- Static fallback for errors/not_found (the dynamic 404 in the site's layout), shown when that page can't be
     built. It can't use the database or the asset pipeline, so its copy and styles are inline. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Página no encontrada — atesoraroseta</title>
<style>
:root {
  --ground: #222221; --ink: #ECEAE6; --ink-2: #A8A59F; --underline: rgba(236, 234, 230, 0.30); --accent: #D9A55B;
  --serif: "Bodoni Moda", "Bodoni 72", Didot, Georgia, serif;
  --sans: "Jost", Futura, "Century Gothic", ui-sans-serif, system-ui, sans-serif;
  --ease: cubic-bezier(0.22, 1, 0.36, 1);
}
html, body { background: var(--ground); }
body { margin: 0; color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
::selection { background: var(--accent); color: #161615; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
.container { box-sizing: border-box; max-width: 1440px; margin-inline: auto; padding-inline: clamp(20px, 4.45vw, 64px); padding-bottom: clamp(64px, 8.4vw, 120px); }
.header { padding-top: clamp(16px, 2.8vw, 40px); padding-bottom: clamp(12px, 2.5vw, 36px); }
.wordmark { display: inline-block; padding-block: 8px; font-family: var(--serif); font-weight: 400; font-size: clamp(27px, 2.35vw, 34px); line-height: 1; letter-spacing: -0.005em; color: var(--ink); text-decoration: none; transition: opacity .3s var(--ease); }
.wordmark:hover { opacity: .7; }
main { padding-top: clamp(40px, 8.4vw, 120px); }
.column { max-width: 920px; display: flex; flex-direction: column; gap: 22px; }
.label { margin: 0; font-weight: 500; font-size: 11px; line-height: 14px; letter-spacing: 0.22em; text-transform: uppercase; color: var(--ink-2); }
h1 { margin: 0; font-family: var(--serif); font-weight: 400; font-size: clamp(48px, 6.7vw, 96px); line-height: 1; letter-spacing: -0.01em; }
.text { max-width: 640px; margin: 0; font-size: 16px; line-height: 1.75; text-wrap: pretty; }
.text-link { align-self: flex-start; padding-block: 12px; font-size: 15px; line-height: 20px; letter-spacing: 0.02em; color: var(--ink); text-decoration: underline; text-decoration-color: var(--underline); text-decoration-thickness: 1px; text-underline-offset: .24em; transition: color .25s var(--ease), text-decoration-color .25s var(--ease); }
.text-link:hover { color: var(--accent); text-decoration-color: currentColor; }
</style>
</head>
<body>
<div class="container">
<div class="header"><a class="wordmark" href="/">atesoraroseta</a></div>
<main>
<div class="column">
<p class="label">404</p>
<h1>Página no encontrada</h1>
<p class="text">La página que buscas no existe o ha cambiado de dirección.</p>
<a class="text-link" href="/">Volver a la obra</a>
</div>
</main>
</div>
</body>
</html>
