# Kamal configuration for atesoraroseta.com. DEPLOY.md explains every step; first replace the values in
# angle brackets (DEPLOY.md, "Values you must provide").
#
# The droplet is shared with other projects. Each one is its own Kamal app behind the single kamal-proxy
# that Kamal runs on ports 80 and 443, which routes every request by host name. To be a good neighbour,
# this app has:
# - unique names: the service atesoraroseta, the volume atesoraroseta_storage and the accessory
#   atesoraroseta-litestream;
# - no published host ports;
# - per-app proxy options only, and no proxy/run section, which would reconfigure the proxy that every
#   project on the server shares.

# Name of the application. Used to uniquely configure containers.
service: atesoraroseta

# The image's name (Kamal puts the local registry, localhost:5555/, in front; see registry below).
image: atesoraroseta

# The droplet, shared with other projects.
servers:
  web:
    - 165.22.43.43

# kamal-proxy: HTTPS on both names with Let's Encrypt certificates (www.atesoraroseta.com answers with a
# 301 to atesoraroseta.com, see lib/www_redirect.rb). These options apply to this app only.
proxy:
  ssl: true
  hosts:
    - atesoraroseta.com
    - www.atesoraroseta.com
  healthcheck:
    path: /up
  # Seconds a request may take, such as an admin save that analyses freshly uploaded images. Thruster in
  # the container gets the same limit (HTTP_WRITE_TIMEOUT below); its default, 30, would cut it short.
  response_timeout: 60
  buffering:
    # 30 MiB. The largest request is a direct upload: one image of at most 25 MiB
    # (ImageAttachments::MAX_BYTES) sent as the raw request body. The other 5 MiB cover the multipart
    # envelope and fields of a form that carries one such file. A file of 25 to 30 MiB still reaches the
    # app and gets its Spanish "pesa más de 25 MB" error; anything larger can never be a valid image here.
    max_request_body: 31457280

# No external registry: Kamal runs a registry container on this Mac (127.0.0.1:5555), pushes the image to it,
# and the droplet pulls it through the deploy's SSH connection. There is no account or token, and nothing to
# clean up in a registry. The droplet keeps the last few images for rollbacks (retain_containers below).
registry:
  server: localhost:5555

# The backups bucket: this project's own private Spaces bucket. The app (BackupUploadsJob) and the
# Litestream accessory both read these; the access keys are secrets (see .kamal/secrets).
x-spaces: &spaces
  SPACES_BUCKET: <SPACES_BUCKET>
  SPACES_REGION: <SPACES_REGION>
  SPACES_ENDPOINT: https://<SPACES_REGION>.digitaloceanspaces.com

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  clear:
    # The site's address: allowed hosts, the www redirect and absolute URLs (config/environments/production.rb).
    APP_HOST: atesoraroseta.com

    # Run the Solid Queue supervisor inside the web server's Puma process to do jobs: image variants and
    # the nightly uploads backup (config/recurring.yml).
    SOLID_QUEUE_IN_PUMA: true

    # Thruster's limit for a whole response, matching proxy/response_timeout.
    HTTP_WRITE_TIMEOUT: 60

    <<: *spaces
  secret:
    # Decrypts config/credentials.yml.enc: the app reads the admin login and the Spaces keys from it.
    - RAILS_MASTER_KEY

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# The SQLite databases and the Active Storage files live in this Docker volume. Litestream and the nightly
# uploads backup copy them to Spaces.
volumes:
  - "atesoraroseta_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Stopped containers (and their images) kept on the droplet for rollbacks, besides the running one.
# Kamal's default, 5, keeps more disk busy on a server other projects share.
retain_containers: 3

# Configure the image builder. The droplet is amd64 and this Mac is arm64: the image is built here, under
# Docker Desktop's amd64 emulation, so the shared droplet never spends CPU, memory or disk on builds. To
# build natively on the droplet instead (faster on a slow Mac, but it loads the server every project
# shares), add a remote: line with the droplet's SSH address, as DEPLOY.md explains (Troubleshooting).
builder:
  arch: amd64

# Use accessory services (secrets come from .kamal/secrets).
accessories:
  # Continuous replication of storage/production.sqlite3 to Spaces (config/litestream.yml). One process
  # per server: the app's zero-downtime deploys briefly run two app containers, but never two of these.
  litestream:
    image: litestream/litestream:0.5.17
    roles:
      - web
    cmd: replicate
    files:
      - config/litestream.yml:/etc/litestream.yml:ro
    volumes:
      - "atesoraroseta_storage:/rails/storage"
    options:
      # The app's user in the image, so the files Litestream writes next to the database stay the app's.
      user: "1000:1000"
    env:
      clear:
        <<: *spaces
      secret:
        - SPACES_ACCESS_KEY_ID
        - SPACES_SECRET_ACCESS_KEY
