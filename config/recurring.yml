production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Off-server backups are off for now (DEPLOY.md, "Turning backups on"). To copy the uploads to Spaces
  # every night at 03:30 Madrid time again, add back:
  #   backup_uploads:
  #     class: BackupUploadsJob
  #     schedule: every day at 3:30am Europe/Madrid
