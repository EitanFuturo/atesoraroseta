      site:
        wordmark: "Nombre (logotipo)"
        nav_work_label: "Menú: Obra"
        nav_torn_posters_label: "Menú: Torn Posters"
        nav_about_label: "Menú: Sobre mí"
        nav_contact_label: "Menú: Contacto"
        torn_posters_intro: "Torn Posters: introducción"
        details_label: "Etiqueta «Detalles»"
        previous_label: "Etiqueta «Anterior»"
        next_label: "Etiqueta «Siguiente»"
        view_details_label: "Enlace a detalles (varios)"
        view_detail_one_label: "Enlace a detalles (uno)"
