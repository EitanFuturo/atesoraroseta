        one: "Ajustes del sitio"
        other: "Ajustes del sitio"
    attributes:
      user:
        email_address: "Correo electrónico"
        password: "Contraseña"
        password_confirmation: "Confirmación de la contraseña"
      artwork:
        title: "Título"
        slug: "Dirección (URL)"
        years: "Año"
        year: "Año"
        year_end: "Año final"
        medium: "Técnica"
        dimensions: "Medidas"
        description: "Descripción"
