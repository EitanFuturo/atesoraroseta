        instagram_handle: "Usuario de Instagram"
        instagram_label: "Etiqueta «Instagram»"
        not_found_title: "404: título"
        not_found_text: "404: texto"
        not_found_link_label: "404: enlace"
    errors:
      messages:
        # Images (read after the attribute name: "Imagen tiene un formato no admitido…").
        image_missing: "es obligatoria"
        image_content_type: "tiene un formato no admitido (usa %{formats})"
        image_too_large: "pesa más de %{max_megabytes} MB"
        # Years (shown on their own: see the "years" formats below).
        years_unparsable: "Escribe un año (2024) o un periodo (2023–2024)"
        years_out_of_range: "Los años deben estar entre %{first} y %{last}"
        year_end_not_after_year: "El año final debe ser posterior al inicial"
        year_end_without_year: "Falta el año inicial del periodo"
        invalid_slug: "solo puede tener letras minúsculas sin acentos, números y guiones (por ejemplo, obra-azul)"
        site_already_exists: "Los ajustes del sitio ya existen"
      models:
        user:
          attributes:
            password:
              # rails-i18n's generic message is masculine ("demasiado corto").
              too_short:
                one: "es demasiado corta (%{count} carácter mínimo)"
                other: "es demasiado corta (%{count} caracteres mínimo)"
        # Year errors are full sentences, so their full message is the message alone
        # (needs config.active_model.i18n_customize_full_message).
        artwork:
          attributes:
            years:
              format: "%{message}"
        torn_poster:
          attributes:
            years:
              format: "%{message}"

  sessions:
    create:
      invalid: "El correo electrónico o la contraseña no son correctos."
      rate_limited: "Demasiados intentos. Espera unos minutos y vuelve a intentarlo."
